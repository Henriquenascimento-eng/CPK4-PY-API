<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>StrideStore - Tênis e Calçados</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho da "loja" -->
    <header class="hero">
        <h1> StrideStore</h1>
        <p>Os melhores tênis, direto pra sua coleção</p>
    </header>

    <main>
        <!-- Vitrine de produtos -->
        <section class="vitrine">
            <h2>Nossos Tênis</h2>
            <div class="grid-produtos" id="lista-produtos"></div>
        </section>

        <!-- Painel de gerenciamento (cadastros) -->
        <section class="painel-admin">
            <h2>Gerenciar</h2>

            <div class="formularios">
                <form id="form-usuario" class="form-card">
                    <h3>Cadastrar Cliente</h3>
                    <label>Nome:
                        <input type="text" id="usuario-nome" required>
                    </label>
                    <label>Email:
                        <input type="email" id="usuario-email" required>
                    </label>
                    <label>Idade:
                        <input type="number" id="usuario-idade">
                    </label>
                    <button type="submit">Cadastrar Cliente</button>
                </form>

                <form id="form-produto" class="form-card">
                    <h3>Cadastrar Tênis</h3>
                    <label>Modelo:
                        <input type="text" id="produto-nome" required>
                    </label>
                    <label>Preço:
                        <input type="number" step="0.01" id="produto-preco" required>
                    </label>
                    <label>Estoque:
                        <input type="number" id="produto-quantidade">
                    </label>
                    <label>Cliente dono:
                        <select id="produto-usuario" required></select>
                    </label>
                    <button type="submit">Cadastrar Tênis</button>
                </form>
            </div>

            <h3>Clientes cadastrados</h3>
            <ul id="lista-usuarios" class="lista-simples"></ul>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
