<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CP4 - Usuários e Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>CP4 - Usuários e Produtos</h1>

    <!-- Bloco 1: cadastro de usuário -->
    <section>
        <h2>Cadastrar Usuário</h2>
        <form id="form-usuario">
            <label>Nome:
                <input type="text" id="usuario-nome" required>
            </label>
            <label>Email:
                <input type="email" id="usuario-email" required>
            </label>
            <label>Idade:
                <input type="number" id="usuario-idade">
            </label>
            <button type="submit">Cadastrar Usuário</button>
        </form>
    </section>

    <!-- Bloco 2: lista de usuários -->
    <section>
        <h2>Usuários Cadastrados</h2>
        <ul id="lista-usuarios"></ul>
    </section>

    <!-- Bloco 3: cadastro de produto -->
    <section>
        <h2>Cadastrar Produto</h2>
        <form id="form-produto">
            <label>Nome:
                <input type="text" id="produto-nome" required>
            </label>
            <label>Preço:
                <input type="number" step="0.01" id="produto-preco" required>
            </label>
            <label>Quantidade:
                <input type="number" id="produto-quantidade">
            </label>
            <label>Usuário dono:
                <select id="produto-usuario" required></select>
            </label>
            <button type="submit">Cadastrar Produto</button>
        </form>
    </section>

    <!-- Bloco 4: lista de produtos -->
    <section>
        <h2>Produtos Cadastrados</h2>
        <ul id="lista-produtos"></ul>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
